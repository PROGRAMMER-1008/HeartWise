[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heartwise"
version = "3.0.0"
description = "Educational Cleveland disease-status classifier"
requires-python = ">=3.12,<3.13"
dependencies = ["scikit-learn==1.8.0", "pandas==3.0.2", "numpy==2.4.4", "joblib==1.5.3", "pydantic==2.13.5", "requests==2.33.1", "reportlab==4.4.10"]

[project.optional-dependencies]
api = ["fastapi==0.141.1", "uvicorn==0.54.0"]
ui = ["streamlit==1.64.0"]
train = ["matplotlib==3.10.8", "xgboost==3.4.1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pypdf>=6,<7", "pymupdf>=1.26,<2", "ruff>=0.11,<1"]

[project.scripts]
heartwise-train = "src.train:main"
heartwise-audit = "src.audit:main"
heartwise-artifact = "src.artifacts:main"

[tool.setuptools]
packages = ["src", "api", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E9", "F"]
